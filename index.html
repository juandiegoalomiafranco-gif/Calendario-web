<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!--
      `interactive-widget=resizes-content`: en Android el teclado pasa a encoger el
      viewport, así que el botón de guardar nunca queda debajo. iOS lo ignora — ahí lo
      resuelve `useKeyboardInset`.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#f4f5f7" />
    <meta
      name="description"
      content="MyLife — la app del celular de Juan Diego para organizar toda su vida: colegio, tareas, entrenamiento, dieta, finanzas, calendario y pendientes en un solo sitio."
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MyLife" />
    <title>MyLife</title>
    <script>
      // Aplica el tema antes del primer pintado para que no haya destello al recargar.
      // Debe mantenerse en sintonía con src/hooks/useTheme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('mivida:theme:v1') || 'system'
          var dark =
            stored === 'dark' ||
            (stored === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0d0e11' : '#f4f5f7')
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
