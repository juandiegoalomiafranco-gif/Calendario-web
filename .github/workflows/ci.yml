name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      # La app arranca sin las variables de Supabase (queda en modo local), así
      # que el build no necesita secretos.
      - name: Build
        run: npm run build
